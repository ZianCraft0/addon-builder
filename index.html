<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedrock Lang Studio - ZianCraft0</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 flex flex-col items-center justify-start font-sans">
  <div class="w-full max-w-xl bg-slate-800/90 backdrop-blur rounded-2xl p-5 shadow-2xl border border-slate-700 space-y-5 my-auto">
    
    <!-- ENCABEZADO DE PRESENTACIÓN -->
    <header class="text-center space-y-1.5 border-b border-slate-700/60 pb-4">
      <h1 class="text-xl font-extrabold text-emerald-400 tracking-wide">Bedrock Lang Studio</h1>
      <p class="text-xs text-slate-400">Traductor Masivo de Localización (.lang) por <span class="text-emerald-300 font-semibold">ZianCraft0</span></p>
      <div class="pt-1 flex items-center justify-center gap-2">
        <label for="globalNamespace" class="text-[10px] text-slate-400">Namespace:</label>
        <input type="text" id="globalNamespace" value="zclegacy" class="bg-slate-900 text-emerald-400 text-xs px-2.5 py-0.5 rounded-lg border border-slate-700 font-mono w-28 text-center focus:outline-none focus:border-emerald-500" placeholder="ej. mi_addon">
      </div>
    </header>

    <!-- TARJETAS DE NAVEGACIÓN / MENÚ PRINCIPAL -->
    <div id="mainMenu" class="space-y-3">
      <p class="text-xs font-semibold text-slate-300 px-1">Selecciona una herramienta para comenzar:</p>
      
      <button onclick="switchView('translator')" class="w-full bg-slate-900 hover:bg-slate-950 border border-slate-700 hover:border-emerald-500/60 p-4 rounded-xl text-left transition-all flex items-center justify-between group shadow-lg">
        <div class="space-y-0.5">
          <div class="text-sm font-bold text-emerald-400 group-hover:translate-x-1 transition-transform">🌐 Traductor Masivo .lang</div>
          <p class="text-[11px] text-slate-400">Traduce automáticamente archivos de texto a todos los idiomas de Bedrock.</p>
        </div>
        <span class="text-slate-500 group-hover:text-emerald-400 text-lg transition-colors">›</span>
      </button>

      <button onclick="switchView('generator')" class="w-full bg-slate-900 hover:bg-slate-950 border border-slate-700 hover:border-emerald-500/60 p-4 rounded-xl text-left transition-all flex items-center justify-between group shadow-lg">
        <div class="space-y-0.5">
          <div class="text-sm font-bold text-emerald-400 group-hover:translate-x-1 transition-transform">⚙️ Generador Rápido de Llaves</div>
          <p class="text-[11px] text-slate-400">Crea claves individuales en formato item/tile/entity usando tu namespace.</p>
        </div>
        <span class="text-slate-500 group-hover:text-emerald-400 text-lg transition-colors">›</span>
      </button>
    </div>

    <!-- MÓDULO 1: TRADUCTOR MASIVO -->
    <div id="view-translator" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <button onclick="switchView('menu')" class="text-xs text-emerald-400 hover:underline flex items-center gap-1 font-semibold">
          ← Volver al menú
        </button>
        <span class="text-[10px] text-slate-400 font-mono">Modo: Traducción Global</span>
      </div>

      <div class="space-y-2 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-300">1. Contenido / Archivo Base (.lang)</label>
          <label for="fileUpload" class="text-[10px] bg-slate-700 hover:bg-slate-600 text-emerald-300 px-2.5 py-1 rounded-lg cursor-pointer transition-all shadow">
            📁 Subir archivo
          </label>
          <input type="file" id="fileUpload" accept=".lang,.txt" class="hidden" onchange="handleFileUpload(event)">
        </div>
        <textarea id="sourceContent" placeholder="item.zclegacy.espada_caos.name=Espada del Caos&#10;tile.zclegacy.bloque_sombras.name=Bloque de las Sombras" class="w-full h-36 bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-emerald-500 resize-none leading-relaxed"></textarea>
      </div>

      <div class="space-y-2 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-semibold text-slate-300">2. Idiomas Destino</label>
          <button onclick="toggleAllLanguages()" class="text-[10px] text-emerald-400 hover:underline">Marcar / Desmarcar Todos</button>
        </div>
        <div id="languageGrid" class="grid grid-cols-2 gap-1.5 bg-slate-950 p-2.5 rounded-xl border border-slate-800 h-36 overflow-y-auto text-[11px] font-mono">
          <!-- Inyectado por JS -->
        </div>
      </div>

      <button onclick="processBatchTranslation()" id="translateBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition-all flex items-center justify-center gap-2">
        <span>🌐 Traducir y Generar Pack (.ZIP)</span>
      </button>

      <!-- RESULTADOS -->
      <div id="resultsContainer" class="hidden space-y-3 pt-3 border-t border-slate-700">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Archivos Traducidos</h2>
          <button onclick="downloadAllZip()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold shadow transition-all">
            📦 Descargar Pack (.ZIP)
          </button>
        </div>

        <div class="flex gap-2">
          <select id="languageSelector" onchange="displaySelectedTranslation()" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs font-mono text-slate-200 flex-grow focus:outline-none focus:border-emerald-500">
          </select>
          <button onclick="copyCurrentOutput()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold">
            Copiar
          </button>
        </div>

        <textarea id="outputContent" readonly class="w-full h-32 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-emerald-400 resize-none leading-relaxed"></textarea>
      </div>

      <!-- LOG DE PROGRESO -->
      <div id="statusLog" class="text-[10px] font-mono text-slate-400 space-y-0.5"></div>
    </div>

    <!-- MÓDULO 2: GENERADOR RÁPIDO DE LLAVES -->
    <div id="view-generator" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <button onclick="switchView('menu')" class="text-xs text-emerald-400 hover:underline flex items-center gap-1 font-semibold">
          ← Volver al menú
        </button>
        <span class="text-[10px] text-slate-400 font-mono">Modo: Generador Personalizado</span>
      </div>

      <div class="space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-700/60">
        <textarea id="genInput" placeholder="Piedra del Caos&#10;Espada Oscura" class="w-full h-28 bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-emerald-500 resize-none"></textarea>
        <div class="grid grid-cols-2 gap-2">
          <select id="genPrefix" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
            <option value="item">Objeto (item.ns...)</option>
            <option value="tile">Bloque (tile.ns...)</option>
            <option value="entity">Entidad (entity.ns...)</option>
          </select>
          <button onclick="generateLangKeys()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-xs shadow">Generar Llaves</button>
        </div>
      </div>

      <div id="genResultContainer" class="hidden space-y-2 bg-slate-900/60 p-4 rounded-xl border border-slate-700/60">
        <textarea id="genOutput" readonly class="w-full h-28 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs font-mono text-emerald-400 resize-none leading-relaxed"></textarea>
        <button onclick="copyGenOutput()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2 rounded-lg font-semibold shadow">Copiar al Portapapeles</button>
      </div>
    </div>

  </div>

  <script>
    const BEDROCK_LANGUAGES = [
      { code: 'en_US', name: 'English (US)', target: 'en' },
      { code: 'en_GB', name: 'English (UK)', target: 'en' },
      { code: 'es_ES', name: 'Español (España)', target: 'es' },
      { code: 'es_MX', name: 'Español (México)', target: 'es' },
      { code: 'pt_BR', name: 'Português (Brasil)', target: 'pt' },
      { code: 'pt_PT', name: 'Português (Portugal)', target: 'pt' },
      { code: 'fr_FR', name: 'Français (France)', target: 'fr' },
      { code: 'fr_CA', name: 'Français (Canada)', target: 'fr' },
      { code: 'de_DE', name: 'Deutsch (Deutschland)', target: 'de' },
      { code: 'it_IT', name: 'Italiano (Italia)', target: 'it' },
      { code: 'ru_RU', name: 'Русский (Россия)', target: 'ru' },
      { code: 'ja_JP', name: '日本語 (日本)', target: 'ja' },
      { code: 'zh_CN', name: '简体中文 (中国)', target: 'zh' },
      { code: 'zh_TW', name: '繁體中文 (台灣)', target: 'zh-TW' },
      { code: 'ko_KR', name: '한국어 (대한민국)', target: 'ko' },
      { code: 'pl_PL', name: 'Polski (Polska)', target: 'pl' },
      { code: 'nl_NL', name: 'Nederlands (Nederland)', target: 'nl' },
      { code: 'tr_TR', name: 'Türkçe (Türkiye)', target: 'tr' },
      { code: 'uk_UA', name: 'Українська (Україна)', target: 'uk' },
      { code: 'cs_CZ', name: 'Čeština (Česko)', target: 'cs' },
      { code: 'hu_HU', name: 'Magyar (Magyarország)', target: 'hu' },
      { code: 'id_ID', name: 'Bahasa Indonesia', target: 'id' },
      { code: 'sv_SE', name: 'Svenska (Sverige)', target: 'sv' }
    ];

    let translatedResults = {};

    window.onload = () => {
      const grid = document.getElementById('languageGrid');
      grid.innerHTML = BEDROCK_LANGUAGES.map(lang => `
        <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-900 p-1 rounded transition-colors">
          <input type="checkbox" value="${lang.code}" data-target="${lang.target}" class="lang-checkbox accent-emerald-500 rounded" ${lang.code === 'en_US' || lang.code === 'pt_BR' ? 'checked' : ''}>
          <span class="text-slate-300 truncate">${lang.code} <span class="text-slate-500 text-[9px]">(${lang.name.split(' ')[0]})</span></span>
        </label>
      `).join('');
    };

    function switchView(view) {
      document.getElementById('mainMenu').classList.toggle('hidden', view !== 'menu');
      document.getElementById('view-translator').classList.toggle('hidden', view !== 'translator');
      document.getElementById('view-generator').classList.toggle('hidden', view !== 'generator');
    }

    function toggleAllLanguages() {
      const checkboxes = document.querySelectorAll('.lang-checkbox');
      const allChecked = Array.from(checkboxes).every(c => c.checked);
      checkboxes.forEach(c => c.checked = !allChecked);
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('sourceContent').value = e.target.result;
      };
      reader.readAsText(file);
    }

    async function processBatchTranslation() {
      const rawText = document.getElementById('sourceContent').value.trim();
      if (!rawText) {
        alert('Por favor ingresa o sube un texto .lang base.');
        return;
      }

      const selectedCheckboxes = document.querySelectorAll('.lang-checkbox:checked');
      if (selectedCheckboxes.length === 0) {
        alert('Selecciona al menos un idioma de destino.');
        return;
      }

      const ns = document.getElementById('globalNamespace').value.trim() || 'zclegacy';
      const btn = document.getElementById('translateBtn');
      const log = document.getElementById('statusLog');
      
      document.getElementById('resultsContainer').classList.add('hidden');

      btn.disabled = true;
      btn.classList.add('opacity-50');
      btn.textContent = '⏳ Traduciendo idiomas... Por favor espere';
      
      log.innerHTML = '<p class="text-yellow-400">Iniciando motor de traducción global...</p>';
      
      translatedResults = {};
      const lines = rawText.split('\n');

      for (const cb of selectedCheckboxes) {
        const langCode = cb.value;
        const targetLang = cb.getAttribute('data-target');
        log.innerHTML += `<p class="text-slate-400">Procesando <code class="text-emerald-400">${langCode}</code>...</p>`;
        
        let translatedLines = [];
        for (let line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('#') || !trimmed.includes('=')) {
            translatedLines.push(line);
            continue;
          }

          const parts = trimmed.split('=');
          let key = parts[0].trim();
          const val = parts.slice(1).join('=').trim();

          if (ns !== 'zclegacy') {
            key = key.replace(/\.zclegacy\./g, `.${ns}.`);
          }

          // Si el idioma destino es español pero el código es diferente (ej. es_ES desde es_MX), permitimos procesar o copiar según corresponda
          if (targetLang === 'es' && langCode.toLowerCase().startsWith('es')) {
            translatedLines.push(`${key}=${val}`);
            continue;
          }

          try {
            const translatedText = await translateString(val, targetLang);
            translatedLines.push(`${key}=${translatedText}`);
            // Pausa breve de 150ms para evitar saturar la API pública
            await new Promise(r => setTimeout(r, 150));
          } catch (e) {
            translatedLines.push(`${key}=${val}`);
          }
        }

        translatedResults[langCode] = translatedLines.join('\n');
      }

      const selector = document.getElementById('languageSelector');
      selector.innerHTML = Object.keys(translatedResults).map(code => `<option value="${code}">${code}.lang</option>`).join('');
      
      displaySelectedTranslation();
      
      document.getElementById('resultsContainer').classList.remove('hidden');
      log.innerHTML = '<p class="text-emerald-400 font-bold">✔ ¡Traducción completada con éxito! Ya puedes descargar tu pack (.ZIP).</p>';
      
      btn.disabled = false;
      btn.classList.remove('opacity-50');
      btn.innerHTML = '<span>🌐 Volver a Traducir y Generar Pack (.ZIP)</span>';
    }

    async function translateString(text, targetLang) {
      const url = `https://lingva.ml/api/v1/es/${targetLang}/${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Error al conectar con la API');
      const data = await res.json();
      return data.translation || text;
    }

    function displaySelectedTranslation() {
      const selected = document.getElementById('languageSelector').value;
      document.getElementById('outputContent').value = translatedResults[selected] || '';
    }

    function copyCurrentOutput() {
      navigator.clipboard.writeText(document.getElementById('outputContent').value);
      alert('¡Contenido .lang copiado!');
    }

    async function downloadAllZip() {
      if (Object.keys(translatedResults).length === 0) return;
      
      const zip = new JSZip();
      const textsFolder = zip.folder("texts");

      for (const [code, content] of Object.entries(translatedResults)) {
        textsFolder.file(`${code}.lang`, content);
      }

      const blob = await zip.generateAsync({ type: "blob" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "bedrock_texts_pack.zip";
      a.click();
    }

    function generateLangKeys() {
      const raw = document.getElementById('genInput').value.trim();
      const prefix = document.getElementById('genPrefix').value;
      const ns = document.getElementById('globalNamespace').value.trim() || 'zclegacy';
      if (!raw) return;

      const lines = raw.split('\n').filter(l => l.trim() !== '');
      const result = lines.map(line => {
        const cleanName = line.trim();
        const keyID = cleanName.toLowerCase().replace(/[^a-z0-9]/g, '_');
        return `${prefix}.${ns}.${keyID}.name=${cleanName}`;
      }).join('\n');

      document.getElementById('genOutput').value = result;
      document.getElementById('genResultContainer').classList.remove('hidden');
    }

    function copyGenOutput() {
      navigator.clipboard.writeText(document.getElementById('genOutput').value);
      alert('¡Llaves generadas copiadas!');
    }
  </script>
</body>
</html>
