<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zian Lang Studio - Traductor Bedrock</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 flex flex-col items-center justify-start font-sans">
  <div class="w-full max-w-4xl bg-slate-800 rounded-2xl p-4 shadow-2xl border border-slate-700 space-y-4 my-auto">
    
    <header class="flex items-center justify-between border-b border-slate-700 pb-3">
      <div>
        <h1 class="text-xl font-extrabold text-emerald-400 tracking-wide">Zian Lang Studio</h1>
        <p class="text-[10px] text-slate-400">Traductor Masivo de Localización (.lang) para Minecraft Bedrock</p>
      </div>
      <span class="text-[10px] bg-slate-900 text-emerald-400 px-2.5 py-1 rounded-lg border border-slate-700 font-mono">Namespace: zclegacy</span>
    </header>

    <!-- ÁREA DE CARGA Y ENTRADA DE TEXTO BASE -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-300">1. Contenido / Archivo Base</label>
          <label for="fileUpload" class="text-[10px] bg-slate-700 hover:bg-slate-600 text-emerald-300 px-2 py-0.5 rounded cursor-pointer transition-all">
            📁 Subir archivo .lang
          </label>
          <input type="file" id="fileUpload" accept=".lang,.txt" class="hidden" onchange="handleFileUpload(event)">
        </div>
        <textarea id="sourceContent" placeholder="item.zclegacy.espada_caos.name=Espada del Caos&#10;tile.zclegacy.bloque_sombras.name=Bloque de las Sombras&#10;entity.zclegacy.jefe_vacio.name=Jefe del Vacío" class="w-full h-56 bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-emerald-500 resize-none leading-relaxed"></textarea>
      </div>

      <!-- CONFIGURACIÓN DE IDIOMAS DESTINO -->
      <div class="space-y-2 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold text-slate-300">2. Idiomas a Traducir</label>
            <button onclick="toggleAllLanguages()" class="text-[10px] text-emerald-400 hover:underline">Seleccionar / Desmarcar Todos</button>
          </div>
          <div id="languageGrid" class="grid grid-cols-2 gap-1.5 bg-slate-950 p-2 rounded-xl border border-slate-800 h-44 overflow-y-auto text-[11px] font-mono">
            <!-- Idiomas inyectados dinámicamente -->
          </div>
        </div>

        <div class="space-y-1.5">
          <div class="flex items-center gap-2">
            <span class="text-[10px] text-slate-400">Motor de Traducción:</span>
            <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-1.5 py-0.5 rounded">Lingva / LibreTranslate (Gratuito & Sin API Key)</span>
          </div>
          <button onclick="processBatchTranslation()" id="translateBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs shadow-lg transition-all flex items-center justify-center gap-2">
            <span>🌐 Traducir y Generar Pack Completo</span>
          </button>
        </div>
      </div>
    </div>

    <!-- RESULTADOS Y EXPORTACIÓN -->
    <div id="resultsContainer" class="hidden space-y-3 pt-2 border-t border-slate-700">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"> Archivos Traducidos</h2>
        <button onclick="downloadAllZip()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold shadow transition-all">
          📦 Descargar Todos (.ZIP)
        </button>
      </div>

      <div class="flex gap-2">
        <select id="languageSelector" onchange="displaySelectedTranslation()" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs font-mono text-slate-200 flex-grow focus:outline-none focus:border-emerald-500">
        </select>
        <button onclick="copyCurrentOutput()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold">
          Copiar
        </button>
      </div>

      <textarea id="outputContent" readonly class="w-full h-44 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-emerald-400 resize-none leading-relaxed"></textarea>
      
      <div id="statusLog" class="text-[10px] font-mono text-slate-400 space-y-0.5"></div>
    </div>

  </div>

  <script>
    // LISTA OFICIAL DE IDIOMAS SOPORTADOS POR MINECRAFT BEDROCK
    const BEDROCK_LANGUAGES = [
      { code: 'en_US', name: 'English (US)', target: 'en' },
      { code: 'en_GB', name: 'English (UK)', target: 'en' },
      { code: 'es_ES', name: 'Español (España)', target: 'es' },
      { code: 'es_MX', name: 'Español (México)', target: 'es' },
      { code: 'pt_BR', name: 'Português (Brasil)', target: 'pt' },
      { code: 'pt_PT', name: 'Português (Portugal)', target: 'pt' },
      { code: 'fr_FR', name: 'Français (France)', target: 'fr' },
      { code: 'fr_CA', name: 'Français (Canada)', target: 'fr' },
      { code: 'de_DE', name: 'Deutsch (Deutschland)', target: 'de' },
      { code: 'it_IT', name: 'Italiano (Italia)', target: 'it' },
      { code: 'ru_RU', name: 'Русский (Россия)', target: 'ru' },
      { code: 'ja_JP', name: '日本語 (日本)', target: 'ja' },
      { code: 'zh_CN', name: '简体中文 (中国)', target: 'zh' },
      { code: 'zh_TW', name: '繁體中文 (台灣)', target: 'zh-TW' },
      { code: 'ko_KR', name: '한국어 (대한민국)', target: 'ko' },
      { code: 'pl_PL', name: 'Polski (Polska)', target: 'pl' },
      { code: 'nl_NL', name: 'Nederlands (Nederland)', target: 'nl' },
      { code: 'tr_TR', name: 'Türkçe (Türkiye)', target: 'tr' },
      { code: 'uk_UA', name: 'Українська (Україна)', target: 'uk' },
      { code: 'cs_CZ', name: 'Čeština (Česko)', target: 'cs' },
      { code: 'hu_HU', name: 'Magyar (Magyarország)', target: 'hu' },
      { code: 'id_ID', name: 'Bahasa Indonesia', target: 'id' },
      { code: 'sv_SE', name: 'Svenska (Sverige)', target: 'sv' }
    ];

    let translatedResults = {};

    // INICIALIZAR CUADRÍCULA DE IDIOMAS
    window.onload = () => {
      const grid = document.getElementById('languageGrid');
      grid.innerHTML = BEDROCK_LANGUAGES.map(lang => `
        <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-900 p-1 rounded transition-colors">
          <input type="checkbox" value="${lang.code}" data-target="${lang.target}" class="lang-checkbox accent-emerald-500 rounded" ${lang.code === 'en_US' || lang.code === 'pt_BR' ? 'checked' : ''}>
          <span class="text-slate-300 truncate">${lang.code} <span class="text-slate-500 text-[9px]">(${lang.name.split(' ')[0]})</span></span>
        </label>
      `).join('');
    };

    function toggleAllLanguages() {
      const checkboxes = document.querySelectorAll('.lang-checkbox');
      const allChecked = Array.from(checkboxes).every(c => c.checked);
      checkboxes.forEach(c => c.checked = !allChecked);
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('sourceContent').value = e.target.result;
      };
      reader.readAsText(file);
    }

    // PROCESAMIENTO Y TRADUCCIÓN MASIVA
    async function processBatchTranslation() {
      const rawText = document.getElementById('sourceContent').value.trim();
      if (!rawText) {
        alert('Por favor ingresa o sube un texto .lang base.');
        return;
      }

      const selectedCheckboxes = document.querySelectorAll('.lang-checkbox:checked');
      if (selectedCheckboxes.length === 0) {
        alert('Selecciona al menos un idioma de destino.');
        return;
      }

      const btn = document.getElementById('translateBtn');
      const log = document.getElementById('statusLog');
      btn.disabled = true;
      btn.classList.add('opacity-50');
      btn.textContent = '⏳ Traduciendo... Espere por favor...';
      
      document.getElementById('resultsContainer').classList.remove('hidden');
      log.innerHTML = '<p class="text-yellow-400">Iniciando motor de traducción...</p>';
      
      translatedResults = {};
      const lines = rawText.split('\n');

      for (const cb of selectedCheckboxes) {
        const langCode = cb.value;
        const targetLang = cb.getAttribute('data-target');
        log.innerHTML += `<p class="text-slate-400">Procesando <code class="text-emerald-400">${langCode}</code>...</p>`;
        
        let translatedLines = [];
        for (let line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('#') || !trimmed.includes('=')) {
            translatedLines.push(line);
            continue;
          }

          const parts = trimmed.split('=');
          const key = parts[0].trim();
          const val = parts.slice(1).join('=').trim();

          // Evitar traducir si el idioma destino es el mismo origen (si es español)
          if (targetLang === 'es') {
            translatedLines.push(`${key}=${val}`);
            continue;
          }

          try {
            const translatedText = await translateString(val, targetLang);
            translatedLines.push(`${key}=${translatedText}`);
          } catch (e) {
            translatedLines.push(`${key}=${val}`); // Fallback al texto original si falla la red
          }
        }

        translatedResults[langCode] = translatedLines.join('\n');
      }

      // Actualizar selector de resultados
      const selector = document.getElementById('languageSelector');
      selector.innerHTML = Object.keys(translatedResults).map(code => `<option value="${code}">${code}.lang</option>`).join('');
      
      displaySelectedTranslation();
      log.innerHTML += '<p class="text-emerald-400 font-bold">✔ ¡Proceso finalizado con éxito!</p>';
      
      btn.disabled = false;
      btn.classList.remove('opacity-50');
      btn.innerHTML = '<span>🌐 Traducir y Generar Pack Completo</span>';
    }

    // MOTOR DE TRADUCCIÓN MEDIANTE INSTANCIA PÚBLICA DE LINGVA / LIBRETRANSLATE
    async function translateString(text, targetLang) {
      const url = `https://lingva.ml/api/v1/es/${targetLang}/${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Error al conectar con la API');
      const data = await res.json();
      return data.translation || text;
    }

    function displaySelectedTranslation() {
      const selected = document.getElementById('languageSelector').value;
      document.getElementById('outputContent').value = translatedResults[selected] || '';
    }

    function copyCurrentOutput() {
      navigator.clipboard.writeText(document.getElementById('outputContent').value);
      alert('¡Contenido .lang copiado al portapapeles!');
    }

    // EXPORTACIÓN ZIP DE TODOS LOS ARCHIVOS
    async function downloadAllZip() {
      if (Object.keys(translatedResults).length === 0) return;
      
      const zip = new JSZip();
      const textsFolder = zip.folder("texts");

      for (const [code, content] of Object.entries(translatedResults)) {
        textsFolder.file(`${code}.lang`, content);
      }

      const blob = await zip.generateAsync({ type: "blob" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "zian_texts_pack.zip";
      a.click();
    }
  </script>
</body>
</html>
